<main>
  <div class="container-fluid lista-reservas">
    <div class="row">
      <div class="col-12">
        <h2>LISTA DE RESERVAS</h2>
      </div>
    </div>
  </div>
  <div class="busqueda-reserva">
    <input type="text" [(ngModel)]="filtro" placeholder="Buscar por nombre o DNI..." />
    <button (click)="buscarReservas()">Buscar</button>
    <button (click)="loadReservations()">Limpiar</button>
  </div>

  <div class="container-fluid listas">
    <div class="reserva" *ngFor="let r of reservas">
      <div class="info">
        <div class="campo">
          <label>N° Reserva:</label>
          <div class="valor-peque">{{ r.id | number:'6.0' }}</div>
        </div>
        <div class="campo">
          <label>Nombre:</label>
          <div class="valor-grande">{{ r.nombreCliente }}</div>
        </div>
        <div class="campo">
          <label>N° Mesa:</label>
          <div class="valor-grande">{{ r.numeroMesa }}</div>
        </div>
        <div class="campo">
          <label>Personas:</label>
          <div class="valor-grande">{{ r.capacidad }}</div>
        </div>
        <div class="campo">
          <label>Zona:</label>
          <div class="valor-grande">{{ r.zone }}</div>
        </div>
        <div class="campo">
          <label>Fecha:</label>
          <div class="valor-grande">
            {{ r.fechaReservada | date:"dd 'de' MMMM 'de' yyyy" }}
          </div>
        </div>
        <div class="hora">Hora: {{ r.horaInicio.slice(0, 5) }}</div>
      </div>

      <div class="estado"
           [ngClass]="{
       'asistio': r.stateReservationClient === 'ASISTIO',
       'no-asistio': r.stateReservationClient === 'NO_ASISTIO'
     }">

        <ng-container [ngSwitch]="r.stateReservationClient">
          <div *ngSwitchCase="'ASISTIO'">ASISTIÓ</div>
          <div *ngSwitchCase="'NO_ASISTIO'">NO ASISTIÓ</div>
          <ng-container *ngSwitchDefault>
            <span class="en-espera-text">EN ESPERA</span>
            <button class="confirmar-btn" (click)="confirmAttendance(r.id)">Confirmar</button>
          </ng-container>
        </ng-container>

      </div>

    </div>
  </div>
</main>
